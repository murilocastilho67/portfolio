    <meta name="color-scheme" content="dark light" />
    <!-- Aplica o tema antes da primeira pintura (evita o flash). Mesma regra de src/lib/theme.ts. -->
    <script>
      ;(function () {
        var theme
        try {
          var saved = localStorage.getItem('theme')
          if (saved === 'light' || saved === 'dark') theme = saved
        } catch (e) {}
        if (!theme) theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        var root = document.documentElement
        root.setAttribute('data-theme', theme)
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'light' ? '#F6F3EC' : '#0B0D10')
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', theme)
      })()
    </script>
